# Secret scan before every commit (ADR-0005).
# Install once with: uvx pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
  # Warn (never block) when a Public Task looks like it holds internal identifiers:
  # email addresses, or config/local.yaml's public_denylist patterns (story 69).
  - repo: local
    hooks:
      - id: check-public-tasks
        name: Public Tasks hold no internal identifiers
        entry: uv run --quiet python scripts/check_public_tasks.py
        language: system
        files: ^(tasks|examples)/[^/]+/(versions/\d+/)?(input\.[^/]+|gold\.md)$
        verbose: true
