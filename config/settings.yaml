# Benchmark settings. Edit in the TUI or by hand; validated on every load.

# Tracks, in catalog order: the groups of Tasks that Regressions are judged on.
# Each Task's task.md names its Track, which must be one of these.
tracks: [Framing, Specs, Prioritize, Story]

# Dimension weights (percent). Must sum to 100.
weights:
  quality: 50
  edit_distance: 20
  time_saved: 20
  cost_latency: 10

# Adopt rule margins, in Quality points on the 1-5 scale.
# Regression: a Track whose quality is more than this below the Baseline's.
regression_margin: 0.5
# Re-test: a weighted score within this of the Baseline's.
retest_margin: 0.2

# Share of a Run's Outputs queued for a human Spot-check (3 of 12).
spot_check_rate: 0.25

# Judge Certification thresholds against the Calibration Set.
calibration:
  within_one_point: 0.9   # share of scores within 1 point of the human score
  weighted_kappa: 0.6     # minimum weighted kappa per Criterion
  min_items: 12           # fewest fully scored items a Certification is made on

# Normalization bands: how a raw measure maps to a 1-5 Dimension score.
# Four ascending thresholds split the range into five bands.
#   better: lower  -> value <= thresholds[0] scores 5, > thresholds[3] scores 1
#   better: higher -> value >= thresholds[3] scores 5, < thresholds[0] scores 1
# Quality needs no band: it is already the 1-5 average of a Task's Criteria.
# Cost/latency combines cost and latency; a null cost makes it latency only.
normalization:
  edit_distance:          # share of words changed between raw Output and final
    better: lower
    thresholds: [0.05, 0.15, 0.30, 0.50]
  time_saved:             # share of Manual Time saved
    better: higher
    thresholds: [0.20, 0.40, 0.60, 0.80]
  cost:                   # USD per Task
    better: lower
    thresholds: [0.01, 0.05, 0.20, 1.00]
  latency:                # seconds to first draft
    better: lower
    thresholds: [10, 30, 60, 120]

# Private Task roots (ADR-0006) are machine-specific, so they live in the git-ignored
# config/local.yaml, not here. Copy config/local.example.yaml to start.
