[project]
name = "bench"
version = "0.1.0"
description = "DS PM Benchmark: harness for deciding whether to adopt an AI tool for DS PM work"
authors = [
    { name = "Jeremy Miller", email = "jeremymiller00@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
bench = "bench.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

