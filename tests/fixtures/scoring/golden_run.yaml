    T1.1: {quality: 4, edit_distance: 4, time_saved: 3, cost_latency: 4, weighted: 3.8, latency_only: false}
    T1.2: {quality: 3, edit_distance: 2, time_saved: 1, cost_latency: 2, weighted: 2.3, latency_only: true}
    T2.1: {quality: 5, edit_distance: 5, time_saved: 5, cost_latency: 3.5, weighted: 4.85, latency_only: false}
  dimensions: {quality: 4.0, edit_distance: 3.6666667, time_saved: 3.0, cost_latency: 3.1666667}
  weighted: 3.65
  track_quality: {Framing: 3.5, Specs: 5.0}
